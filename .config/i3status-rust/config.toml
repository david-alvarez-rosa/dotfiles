[theme]
theme = "native"
[theme.overrides]
separator = " "
warning_fg = "#E88939"
critical_fg = "#f9555f"

[icons]
icons = "awesome4"
[icons.overrides]
update = ""

[[block]]
block = "packages"
package_manager = ["pacman"]
interval = 21600
format = " $icon $pacman updates "
format_singular = " $icon 1 update "
format_up_to_date = " $icon up to date "
theme_overrides = { idle_fg = "#1793D1", info_fg = "#1793D1", good_fg = "#1793D1" }
[[block.click]]
button = "left"
cmd = "notify-send 'Available updates' \"$(checkupdates --nocolor | cut -d' ' -f1)\""

[[block]]
block = "custom"
command = "ip -o link | grep -q tun && echo up || echo down"
format = "  $text "
interval = 30
theme_overrides = { idle_fg = "#589df6", info_fg = "#589df6", good_fg = "#589df6" }

[[block]]
block = "disk_space"
path = "~"
interval = 3600
format = " $icon $available "
theme_overrides = { idle_fg = "#21b089", info_fg = "#21b089", good_fg = "#21b089" }

[[block]]
block = "disk_space"
path = "/"
interval = 3600
format = "  $total "
theme_overrides = { idle_fg = "#f9555f", info_fg = "#f9555f", good_fg = "#f9555f" }

[[block]]
block = "temperature"
chip = "thinkpad-isa-*"
inputs = ["CPU"]
interval = 30
format = " $icon $max "
theme_overrides = { idle_fg = "#E88939", info_fg = "#E88939", good_fg = "#E88939" }

[[block]]
block = "cpu"
interval = 10
format = " $icon $utilization "
theme_overrides = { idle_fg = "#589df6", info_fg = "#589df6", good_fg = "#589df6" }

[[block]]
block = "memory"
interval = 10
format = " $icon $mem_avail.eng(prefix:Gi) "
theme_overrides = { idle_fg = "#21b089", info_fg = "#21b089", good_fg = "#21b089" }

[[block]]
block = "sound"
format = " $icon {$volume|MUTE} "
theme_overrides = { idle_fg = "#f9555f", info_fg = "#f9555f", good_fg = "#f9555f" }

[[block]]
block = "battery"
interval = 30
format = " $icon $percentage "
full_format = " $icon $percentage "
not_charging_format = " $icon $percentage "
theme_overrides = { idle_fg = "#E88939", info_fg = "#E88939", good_fg = "#E88939" }
[[block.click]]
button = "left"
cmd = "notify-send 'Battery information' \"$(upower --battery | grep -E 'state|time to|energy|percentage|capacity')\""

[[block]]
block = "net"
device = "^wlp0s20f3$"
interval = 15
format = " $icon $signal_strength "
inactive_format = " $icon Off "
theme_overrides = { idle_fg = "#589df6", info_fg = "#589df6", good_fg = "#589df6" }

[[block]]
block = "time"
interval = 20
format = " $icon $timestamp.datetime(f:'%H:%M') "
theme_overrides = { idle_fg = "#21b089", info_fg = "#21b089", good_fg = "#21b089" }

[[block]]
block = "time"
interval = 300
format = " ^icon_calendar $timestamp.datetime(f:'%A %d') "
theme_overrides = { idle_fg = "#f9555f", info_fg = "#f9555f", good_fg = "#f9555f" }

[[block]]
block = "keyboard_layout"
format = "$layout"
theme_overrides = { idle_fg = "#9b59b6", info_fg = "#9b59b6", good_fg = "#9b59b6" }
[block.mappings]
"es (N/A)" = "  ES "
"us (N/A)" = ""
